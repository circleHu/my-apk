name: Build Android APK

# 触发方式：
#  1) push 到 main 分支
#  2) 在 GitHub 仓库 Actions 页面手动点 "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Cordova CLI
        run: npm install -g cordova@11.1.0

      # 说明：nodejs-mobile-cordova 在 npm 上的真实最新版本为 0.4.3（不存在 0.5.x）。
      # 0.4.3 已内置把 www/nodejs-project 作为 node 项目拷贝并运行。
      - name: 添加 nodejs-mobile 插件（内嵌 Node 运行时，用于在手机本地跑服务）
        run: cordova plugin add nodejs-mobile-cordova@0.4.3

      - name: 添加 Android 平台
        run: cordova platform add android@10.1.2

      - name: 构建 Debug APK
        run: cordova build android --no-telemetry

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: short-drama-apk
          path: platforms/android/app/build/outputs/apk/debug/android-debug.apk
          retention-days: 90
